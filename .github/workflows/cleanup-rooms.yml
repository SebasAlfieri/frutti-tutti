name: Cleanup stale rooms

on:
  schedule:
    # Every day at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installed on the fly so it never becomes a runtime dependency.
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin

      - name: Delete stale rooms
        run: node scripts/cleanup-stale-rooms.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
